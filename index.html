<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1e8" />
    <meta name="description" content="Ranjan Shetty — software developer and creative builder. Explore selected work, tools, and ways to connect." />
    <title>r. — Ranjan's Space</title>
    <link id="site-favicon" rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2026-10-06-inverted" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="os.css" />
  </head>
  <body>
    <main class="desktop" id="desktop">
      <div class="wallpaper-layer" id="wallpaper-layer" aria-hidden="true"></div>
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <section class="workspace" id="home" aria-label="Ranjan's personal desktop">
        <nav class="desktop-apps" id="desktop-apps" role="group" aria-label="Desktop shortcuts"></nav>
        <p class="desktop-status" id="desktop-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <div class="window-layer" id="window-layer" aria-live="off" hidden></div>
      </section>

      <nav class="dock" aria-label="Portfolio dock">
        <button class="dock-home" id="start-toggle" type="button" aria-label="Open Start menu" aria-expanded="false" aria-controls="start-menu"><span class="dock-symbol">r.</span><span class="dock-home-label">Start</span></button>
        <div class="dock-apps" role="group" aria-label="Open applications"></div>
        <div class="dock-system">
          <div class="dock-status"><button class="sfx-toggle is-on" id="sfx-toggle" type="button" aria-label="Turn sound effects off" aria-pressed="true" title="Sound effects on"><span class="status-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button><button id="clock-time" type="button" aria-label="Current local time; click to show date" aria-pressed="false" title="Click to show date">--:-- --</button></div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Change appearance"><span class="theme-glyph" aria-hidden="true"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" focusable="false"><path d="M19.2 15.1A8.2 8.2 0 0 1 8.9 4.8a8.3 8.3 0 1 0 10.3 10.3Z" /></svg><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="3.5" /><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2.5 12h2m15 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg></span></button>
        </div>
      </nav>

      <section class="start-menu" id="start-menu" aria-label="Start menu" hidden>
        <header class="start-menu-head">
          <div class="start-menu-profile">
            <span class="start-menu-mark" aria-hidden="true"><img src="assets/200.gif?v=2026-10-03" alt="" width="34" height="34" loading="eager" decoding="async" /></span>
            <span class="start-menu-profile-copy"><strong>Ranjan Shetty</strong><small>Portfolio OS v2.6</small></span>
          </div>
          <div class="start-menu-actions" role="group" aria-label="Quick actions">
            <button class="start-menu-action" id="start-contact" type="button" data-open-app="contact" aria-label="Contact Ranjan" title="Contact"><span data-app-icon="contact" aria-hidden="true"></span></button>
            <button class="start-menu-action" id="start-settings" type="button" data-open-app="preferences" aria-label="Open Preferences" title="Preferences"><span data-app-icon="preferences" aria-hidden="true"></span></button>
          </div>
        </header>
        <nav class="start-menu-list" aria-label="Apps and sections">
          <button class="start-menu-item" type="button" data-open-app="about"><span data-app-icon="about" aria-hidden="true"></span><span>About Me</span></button>
          <button class="start-menu-item" type="button" data-open-app="projects"><span data-app-icon="projects" aria-hidden="true"></span><span>Projects</span></button>
          <button class="start-menu-item" type="button" data-open-app="toolkit"><span data-app-icon="toolkit" aria-hidden="true"></span><span>Skills &amp; Tools</span></button>
          <button class="start-menu-item" type="button" data-open-app="notes"><span data-app-icon="notes" aria-hidden="true"></span><span>Sticky Notes</span></button>
          <button class="start-menu-item" type="button" data-open-app="terminal"><span data-app-icon="terminal" aria-hidden="true"></span><span>Terminal</span></button>
        </nav>
      </section>

      <div class="desktop-context-menu" id="desktop-context-menu" role="menu" aria-label="Desktop shortcut actions" hidden>
        <button type="button" role="menuitem" data-desktop-action="open">Open</button>
        <button type="button" role="menuitem" data-desktop-action="add" hidden>Add to desktop</button>
        <button type="button" role="menuitem" data-desktop-action="rename">Rename</button>
        <button type="button" role="menuitem" data-desktop-action="delete">Delete</button>
        <span class="desktop-context-separator" aria-hidden="true"></span>
        <button type="button" role="menuitem" data-desktop-action="select-all">Select All</button>
      </div>
    </main>

    <template id="window-template">
    <section class="app-window" role="dialog" aria-modal="false" tabindex="-1">
        <header class="window-bar">
          <div class="window-app-identity"><span class="window-app-name"></span></div>
          <span class="window-bar-center"></span>
          <div class="window-controls">
            <button class="window-control minimize" type="button" data-window-action="minimize" aria-label="Minimize"><span></span></button>
        <button class="window-control maximize" type="button" data-window-action="maximize" aria-label="Maximize" aria-pressed="false"><span></span></button>
            <button class="window-control close" type="button" data-window-action="close" aria-label="Close"><span></span></button>
          </div>
        </header>
        <div class="window-content"></div>
        <span class="window-resize-handle resize-n" data-resize="n" aria-hidden="true"></span>
        <span class="window-resize-handle resize-e" data-resize="e" aria-hidden="true"></span>
        <span class="window-resize-handle resize-s" data-resize="s" aria-hidden="true"></span>
        <span class="window-resize-handle resize-w" data-resize="w" aria-hidden="true"></span>
        <span class="window-resize-handle resize-nw" data-resize="nw" aria-hidden="true"></span>
        <span class="window-resize-handle resize-ne" data-resize="ne" aria-hidden="true"></span>
        <button class="window-resize-handle resize-se" type="button" data-resize="se" aria-label="Resize window from bottom right corner" aria-keyshortcuts="Alt+Shift+ArrowUp Alt+Shift+ArrowDown Alt+Shift+ArrowLeft Alt+Shift+ArrowRight"></button>
        <span class="window-resize-handle resize-sw" data-resize="sw" aria-hidden="true"></span>
      </section>
    </template>

    <template id="about-content">
      <article class="view view-about">

        <div class="profile-hero">
          <div class="profile-copy"><p class="profile-greeting">Hello, I&rsquo;m Ranjan</p><h2>Developer with<br class="profile-headline-break" /> <em>an eye for detail.</em></h2><p class="profile-intro"></p><button class="inline-link" type="button" data-open-app="projects">A few things I&rsquo;ve made <span aria-hidden="true">↗</span></button></div>
          <img class="profile-artwork" src="assets/ranjanshetty.gif?v=2026-10-02" alt="Animated illustration of a playful cat on a floating island" width="896" height="896" loading="lazy" />
        </div>
        <div class="profile-facts"><div class="profile-fact"><span class="fact-label">Focus</span><strong>Software, craft &amp; interaction</strong></div><div class="profile-fact"><span class="fact-label">Education</span><strong class="education-value"></strong></div><div class="profile-fact"><span class="fact-label">Currently</span><strong>Learning by building</strong></div></div>

      </article>
    </template>

    <template id="projects-content">
      <article class="view view-projects">
        <header class="projects-heading"><h2>Selected work</h2></header>
        <div class="project-list"></div>
      </article>
    </template>

    <template id="toolkit-content">
      <article class="view view-toolkit">
        <header class="toolkit-heading"><h2>Skills &amp; tools</h2><p>Search the technologies I use to build across the stack.</p></header>
        <label class="skill-search"><span aria-hidden="true">⌕</span><input type="search" data-skill-search placeholder="Search skills and tools" aria-label="Search skills and tools" /><span class="skill-count" data-skill-count aria-live="polite"></span></label>
        <div class="skill-groups"></div>
        <p class="skills-empty" data-skills-empty hidden>No matches. Try another search.</p>
      </article>
    </template>

    <template id="contact-content">
      <article class="view view-contact" aria-labelledby="contact-title">
        <div class="contact-panel">
          <header class="contact-heading">
            <h2 id="contact-title">Contact Me</h2>
            <p class="contact-intro">For a project, opportunity, or a quick hello.</p>
          </header>
          <form class="contact-form" data-contact-form novalidate>
            <div class="contact-field">
              <label class="contact-field-label" for="contact-name"><span>Name</span><span class="contact-required">Required</span></label>
              <input id="contact-name" name="name" type="text" data-contact-field="name" autocomplete="name" maxlength="80" aria-describedby="contact-name-error" aria-invalid="false" required />
              <p class="contact-field-error" id="contact-name-error" data-contact-error="name" aria-live="polite" hidden></p>
            </div>
            <div class="contact-field">
              <label class="contact-field-label" for="contact-email"><span>Email</span><span class="contact-required">Required</span></label>
              <input id="contact-email" name="email" type="email" data-contact-field="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="you@example.com" aria-describedby="contact-email-error" aria-invalid="false" required />
              <p class="contact-field-error" id="contact-email-error" data-contact-error="email" aria-live="polite" hidden></p>
            </div>
            <div class="contact-field">
              <label class="contact-field-label" for="contact-message"><span>Message</span><span class="contact-required">Required</span></label>
              <textarea id="contact-message" name="message" data-contact-field="message" rows="3" maxlength="2400" placeholder="What would you like to talk about?" aria-describedby="contact-message-error" aria-invalid="false" required></textarea>
              <p class="contact-field-error" id="contact-message-error" data-contact-error="message" aria-live="polite" hidden></p>
            </div>
            <div class="contact-feedback">
              <button class="contact-feedback-toggle" type="button" data-feedback-toggle aria-expanded="false" aria-controls="contact-feedback-panel">
                <span class="contact-feedback-plus" data-feedback-indicator aria-hidden="true">+</span>
                <span>Add feedback</span>
                <span class="contact-optional">Optional</span>
              </button>
              <div class="contact-feedback-panel" id="contact-feedback-panel" data-feedback-panel hidden>
                <label class="contact-field-label" for="contact-feedback"><span>Feedback</span><span class="contact-required">Optional</span></label>
                <textarea id="contact-feedback" name="feedback" data-feedback-field rows="2" maxlength="1600" placeholder="Anything that could work better?" disabled></textarea>
              </div>
            </div>
            <div class="contact-form-actions">
              <p class="contact-form-status" data-contact-status role="status" aria-live="polite" aria-atomic="true"></p>
              <button class="contact-submit" type="submit">Send message <span aria-hidden="true">↗</span></button>
            </div>
          </form>
        </div>
      </article>
    </template>

    <template id="preferences-content">
      <article class="view view-preferences" aria-labelledby="preferences-title">
        <header class="preferences-heading">
          <h2 id="preferences-title">Personalize your desktop</h2>
          <p>Your wallpaper and sound stay on this device.</p>
        </header>
        <section class="preferences-section" aria-labelledby="wallpaper-title">
          <div class="preferences-section-heading">
            <div><h3 id="wallpaper-title">Wallpaper</h3><p>Choose an image, GIF, or video for your desktop.</p></div>
            <span class="preferences-state" data-wallpaper-state>Default</span>
          </div>
          <div class="wallpaper-preview" data-wallpaper-preview role="group" aria-label="Wallpaper preview">
            <span class="wallpaper-preview-empty" data-wallpaper-preview-empty>Default desktop</span>
            <div class="wallpaper-audio-controls" data-wallpaper-audio-controls data-open="false" hidden role="group" aria-label="Wallpaper video audio controls">
              <button class="wallpaper-audio-toggle" type="button" data-wallpaper-audio aria-label="Mute wallpaper video audio" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                  <path d="M3.5 9v6h4l5 4V5l-5 4h-4Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6" />
                  <path data-wallpaper-audio-wave d="M16 9a5 5 0 0 1 0 6m2.5-8.5a8.5 8.5 0 0 1 0 11" stroke="currentColor" stroke-linecap="round" stroke-width="1.6" />
                  <path data-wallpaper-audio-muted d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-linecap="round" stroke-width="1.6" hidden />
                </svg>

              </button>
              <div class="wallpaper-audio-popover" id="wallpaper-audio-popover" role="group" aria-label="Wallpaper video volume">
                <button class="wallpaper-audio-step" type="button" data-wallpaper-volume-down aria-label="Decrease wallpaper volume">−</button>
                <output class="wallpaper-audio-value" data-wallpaper-volume-value aria-live="polite">50%</output>
                <button class="wallpaper-audio-step" type="button" data-wallpaper-volume-up aria-label="Increase wallpaper volume">+</button>
              </div>
            </div>
          </div>
          <div class="preferences-actions">
            <input class="preferences-file-input" id="wallpaper-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/ogg" data-wallpaper-file tabindex="-1" aria-hidden="true" />
            <button class="preferences-button preferences-button-secondary" type="button" data-wallpaper-choose>Choose wallpaper</button>
            <button class="preferences-button preferences-button-primary" type="button" data-wallpaper-save disabled>Save wallpaper</button>
            <button class="preferences-button preferences-button-quiet" type="button" data-wallpaper-reset>Reset to default</button>
          </div>
          <p class="preferences-file-name" data-wallpaper-name>Up to 20 MB for images and GIFs, 100 MB for video.</p>
          <p class="preferences-status" data-wallpaper-message role="status" aria-live="polite" aria-atomic="true"></p>
        </section>
        <section class="preferences-section preferences-sound" aria-labelledby="sound-title">
          <div class="preferences-section-heading">
            <div><h3 id="sound-title">Desktop sound</h3><p>Add an optional looped audio track.</p></div>
            <span class="preferences-optional">Optional</span>
          </div>
          <div class="preferences-actions">
            <input class="preferences-file-input" id="custom-sound-file" type="file" accept="audio/mpeg,audio/mp4,audio/aac,audio/wav,audio/ogg,audio/webm,audio/flac,.mp3,.m4a,.aac,.wav,.ogg,.opus,.webm,.flac" data-sound-file tabindex="-1" aria-hidden="true" />
            <button class="preferences-button preferences-button-secondary" type="button" data-sound-choose>Choose sound</button>
            <button class="preferences-button preferences-button-secondary" type="button" data-sound-save disabled>Save sound</button>
            <button class="preferences-button preferences-button-quiet" type="button" data-sound-remove hidden>Remove</button>
          </div>
          <p class="preferences-file-name" data-sound-name>No custom sound selected · up to 25 MB.</p>
          <label class="preferences-sound-toggle"><input type="checkbox" data-sound-enabled disabled /><span class="preferences-switch" aria-hidden="true"></span><span>Play desktop sound</span></label>
          <label class="preferences-volume" for="desktop-sound-volume"><span>Volume</span><input id="desktop-sound-volume" type="range" min="0" max="100" step="1" value="35" data-sound-volume disabled /><output data-sound-volume-value for="desktop-sound-volume">35%</output></label>
          <p class="preferences-status" data-sound-message role="status" aria-live="polite" aria-atomic="true"></p>
        </section>
        <details class="preferences-appearance">
          <summary>Appearance</summary>
          <label for="preferences-theme">Theme</label>
          <select id="preferences-theme" data-preferences-theme><option value="light">Light</option><option value="dark">Dark</option></select>
        </details>
      </article>
    </template>

    <template id="terminal-content">
      <article class="view view-terminal">
        <div class="terminal-shell"><div class="terminal-output" data-terminal-output aria-live="polite"><p>Welcome. Type help to see what you can do.</p></div><form class="terminal-form" data-terminal-form><label for="terminal-input"><span>ranjan@portfolio</span><b>:~</b><i aria-hidden="true">$</i></label><input id="terminal-input" data-terminal-input autocomplete="off" spellcheck="false" aria-label="Terminal command" placeholder="" /></form></div>
      </article>
    </template>

    <template id="notes-content">
      <article class="view view-notes">
        <header class="notes-heading"><div><h2>Notes</h2><p class="notes-count" data-notes-count>0 of 40 notes</p></div><div class="notes-toolbar"><span class="notes-status" data-notes-status aria-live="polite">Saved locally</span><button type="button" class="undo-note" data-note-undo hidden>Undo</button><button type="button" class="add-note" data-note-add>New note <span aria-hidden="true">+</span></button></div></header>
        <div class="notes-board" data-notes-board></div>
      </article>
    </template>

    <script src="js/portfolio-data.js"></script>
    <script src="portfolio.js"></script>
    <script src="js/preferences.js"></script>
    <script src="js/desktop-icons.js"></script>
  </body>
</html>
