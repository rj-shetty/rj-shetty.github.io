<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cat Ears -->
  <polygon points="20,44 14,14 44,28" fill="#f4c042" stroke="#2b2825" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="22,40 18,20 38,30" fill="#fbcfe8"/>

  <polygon points="80,44 86,14 56,28" fill="#f4c042" stroke="#2b2825" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="78,40 82,20 62,30" fill="#fbcfe8"/>

  <!-- Body -->
  <path d="M22 65 C22 45, 78 45, 78 65 C82 85, 75 92, 50 92 C25 92, 18 85, 22 65 Z" fill="#f4c042" stroke="#2b2825" stroke-width="4"/>

  <!-- Head -->
  <ellipse cx="50" cy="50" rx="34" ry="26" fill="#f4c042" stroke="#2b2825" stroke-width="4"/>

  <!-- Tummy patch -->
  <ellipse cx="50" cy="74" rx="18" ry="14" fill="#fffdfa"/>

  <!-- Eyes -->
  <circle cx="39" cy="48" r="5" fill="#2b2825"/>
  <circle cx="61" cy="48" r="5" fill="#2b2825"/>
  <!-- Eye highlights -->
  <circle cx="37.5" cy="46.5" r="1.8" fill="#ffffff"/>
  <circle cx="59.5" cy="46.5" r="1.8" fill="#ffffff"/>

  <!-- Nose -->
  <polygon points="48,55 52,55 50,58" fill="#e0533c"/>

  <!-- Mouth -->
  <path d="M44 59 Q50 63 50 58 Q50 63 56 59" fill="none" stroke="#2b2825" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="31" cy="54" rx="4" ry="2.5" fill="#f87171" fill-opacity="0.6"/>
  <ellipse cx="69" cy="54" rx="4" ry="2.5" fill="#f87171" fill-opacity="0.6"/>

  <!-- Whiskers -->
  <line x1="20" y1="52" x2="30" y2="53" stroke="#2b2825" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="57" x2="30" y2="56" stroke="#2b2825" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="52" x2="70" y2="53" stroke="#2b2825" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="57" x2="70" y2="56" stroke="#2b2825" stroke-width="2" stroke-linecap="round"/>

  <!-- Paws -->
  <circle cx="36" cy="85" r="5" fill="#fffdfa" stroke="#2b2825" stroke-width="3"/>
  <circle cx="64" cy="85" r="5" fill="#fffdfa" stroke="#2b2825" stroke-width="3"/>
</svg>
